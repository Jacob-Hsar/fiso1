            margin: 0;
            padding: 0;
        }

            display: flex;
            align-items: center;
            gap: 24px;
            padding: 12px 18px 12px 12px;
            margin-bottom: 28px;
            background: rgba(255, 248, 225, 0.6);
            border-radius: 32px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            flex-wrap: wrap;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.05);

        .logo-placeholder {

            height: 80px;
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.25);
            flex-shrink: 0;
            padding: 8px;
        }
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .brand-text h2 {
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.4px;
            color: #5a3e0b;
            background: linear-gradient(135deg, #8b6508, #d4af37, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-text small {
            font-size: 14px;
            color: #8b7a5a;
            font-weight: 500;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #8b7a5a;
        }

        /* ---------- Headings ---------- */
        h1 {
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 18px;
            margin-bottom: 24px;
            color: #5a3e0b;
        }
        h1 small {
            font-size: 15px;
            font-weight: 500;
            color: #a08050;
            margin-left: 2px;
        }
        .badge-total {
            margin-left: auto;
            background: rgba(212, 175, 55, 0.15);
            padding: 6px 22px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            color: #8b6508;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .submitted-badge {
            background: #b8860b;
            color: white;
            padding: 4px 20px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
            display: none;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.4);
        }
        .submitted-badge.show {
            display: inline-block;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
            padding-bottom: 4px;
        }
        .tab-btn {
            background: rgba(255, 248, 230, 0.6);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            color: #7a5a20;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .tab-btn:hover {
            background: rgba(255, 248, 230, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.15);
            border-color: #d4af37;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            border-color: #b8860b;
            color: white;
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.35);
        }
        .tab-btn .count {
            font-weight: 500;
            font-size: 12px;
            opacity: 0.8;
            margin-left: 6px;
        }

        /* ---------- Summary Box ---------- */
        .summary-box {
            background: linear-gradient(135deg, #fef9e7, #fdf0d5);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 18px 28px;
            margin-bottom: 24px;
            display: none;
            font-weight: 600;
            font-size: 17px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(184, 134, 11, 0.10);
            backdrop-filter: blur(4px);
        }
        .summary-box.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .summary-box .correct-count {
            color: #0b6e4f;
        }
        .summary-box .wrong-count {
            color: #b91c1c;
        }
        .summary-box .unanswered-count {
            color: #b45309;
        }

        .quiz-container {
            display: block;
        }
        .tab-content {
            max-height: 72vh;
            overflow-y: auto;
            padding-right: 6px;
        }
        .tab-content::-webkit-scrollbar {
            width: 6px;
        }
        .tab-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

            align-items: flex-start;

            border-color: #d4af37;
            box-shadow: 0 8px 30px rgba(184, 134, 11, 0.12);
            transform: translateY(-2px) scale(1.005);
            background: rgba(255, 252, 242, 0.95);
        }

        /* ---------- 3D Icon Wrapper (Enhanced & Floating) ---------- */
        .icon-3d-wrapper {
            flex-shrink: 0;
            width: 88px;
            height: 88px;
            perspective: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatIcon 5s ease-in-out infinite;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(184, 134, 11, 0.25));
        }
        .question-card:hover .icon-3d-wrapper {
            transform: perspective(500px) rotateX(4deg) rotateY(8deg) scale(1.08);
            filter: drop-shadow(0 15px 30px rgba(184, 134, 11, 0.45));
        }
        @keyframes floatIcon {
            0% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
            50% { transform: translateY(-8px) rotateX(2deg) rotateY(4deg); }
            100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
        }
        .icon-3d-wrapper svg {
            width: 100%;
            height: 100%;
            transition: filter 0.3s;
        }

        .q-content {
            flex: 1;
            min-width: 0;
        }
        .q-top-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            margin-bottom: 4px;
        }
        .q-num {

            color: #8b6508;
            font-size: 13px;
            min-width: 40px;
            background: rgba(212, 175, 55, 0.15);
            padding: 4px 10px;
            border-radius: 40px;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .q-text {
            font-weight: 500;
            font-size: 16px;
            line-height: 1.5;
            color: #3d2a0c;
        }
        .code-block {
            background: #2a1f0a;
            color: #f5e7b8;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            overflow-x: auto;
            margin: 8px 0 10px 0;
            border: 1px solid #b8860b;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            white-space: pre;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 8px 0 4px 0;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px 8px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
            border: 1.5px solid transparent;
            background: rgba(255, 248, 225, 0.3);
        }
        .options label:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #b8860b;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ---------- Feedback ---------- */
        .q-feedback {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 40px;
            display: none;
            border: 1px solid transparent;
        }
        .q-feedback.show {
            display: inline-block;
        }
        .q-feedback.correct {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }
        .q-feedback.wrong {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }
        .q-feedback .correct-answer {
            font-weight: 700;
            color: #0f3b5e;
        }

        /* ---------- Actions ---------- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            align-items: center;
            margin: 28px 0 16px;
            padding-top: 20px;
            border-top: 2px solid rgba(212, 175, 55, 0.2);
        }
        .btn {
            border: none;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 38px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            color: #5a3e0b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 12px 30px rgba(184, 134, 11, 0.15);
        }
        .btn-success {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.35);
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #c9a04e, #a67c00);
            box-shadow: 0 12px 32px rgba(184, 134, 11, 0.45);
        }
        .btn-outline {
            background: rgba(255, 248, 230, 0.7);
            backdrop-filter: blur(4px);
            border: 1.5px solid #b8860b;
            color: #8b6508;
        }
        .btn-outline:hover {
            background: #b8860b;
            color: white;
            border-color: #b8860b;
        }
        .score-box {
            font-weight: 600;
            font-size: 17px;
            background: rgba(255, 248, 230, 0.7);
            backdrop-filter: blur(4px);
            padding: 8px 30px;
            border-radius: 60px;
            margin-left: auto;
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            white-space: nowrap;
            color: #5a3e0b;
        }
        .score-box .num {
            color: #b8860b;
            font-weight: 700;
        }
        .score-box .num-answered {
            color: #5a3e0b;
            font-weight: 600;
        }

        .reset-area {
            margin-top: 6px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .reset-area .btn {
            font-size: 13px;
            padding: 8px 24px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #b09a70;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding-top: 20px;
        }

        @media (max-width: 680px) {
            .app {
                padding: 16px 14px 24px;
                border-radius: 28px;
            }
            h1 {
                font-size: 22px;
            }
            .question-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 16px 14px 14px;
            }
            .icon-3d-wrapper {
                width: 72px;
                height: 72px;
            }
            .q-top-row {
                justify-content: center;
                flex-wrap: wrap;
            }
            .options label {
                padding: 6px 12px;
                font-size: 14px;
            }
            .tabs .tab-btn {
                font-size: 12px;
                padding: 6px 16px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .score-box {
                margin-left: 0;
                text-align: center;
            }
            .btn {
                justify-content: center;
                padding: 12px 20px;
            }
            .brand-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .brand-text h2 {
                font-size: 20px;
            }
            .logo-placeholder {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>

                { id: 25, q: 'Which tool is used to fill areas with color or patterns in Adobe Photoshop?', opts: ['Paint Bucket Tool', 'Gradient Tool', 'Brush Tool', 'Lasso Tool'], ans: 'A' }
            ]
        }];

        // ============================================================
        //  APP STATE
        // ============================================================
        let currentLevel = 'kg';
        let selections = {};
        let submitted = false;

        // ============================================================
        //  3D GOLDEN SVG ICON GENERATOR (Enhanced & Glowing)
        // ============================================================
        function get3DSvgForQuestion(q) {
            const text = q.q.toLowerCase();
            let type = 'computer';
            if (text.includes('keyboard') || text.includes('type') || text.includes('backspace') || text.includes('spacebar') || text.includes('enter')) type = 'keyboard';
            else if (text.includes('mouse') || text.includes('click') || text.includes('pointer')) type = 'mouse';
            else if (text.includes('speaker') || text.includes('sound') || text.includes('music') || text.includes('listen')) type = 'speaker';
            else if (text.includes('paint') || text.includes('draw') || text.includes('color') || text.includes('eraser') || text.includes('art')) type = 'paint';
            else if (text.includes('notepad') || text.includes('wordpad') || text.includes('text') || text.includes('font') || text.includes('save')) type = 'notepad';
            else if (text.includes('printer') || text.includes('print')) type = 'printer';
            else if (text.includes('binary') || text.includes('0') && text.includes('1')) type = 'binary';
            else if (text.includes('hard drive') || text.includes('storage') || text.includes('ram') || text.includes('rom') || text.includes('memory') || text.includes('bytes') || text.includes('kb') || text.includes('mb') || text.includes('gb') || text.includes('tb')) type = 'storage';
            else if (text.includes('excel') || text.includes('formula') || text.includes('chart') || text.includes('cell') || text.includes('pivot') || text.includes('countif')) type = 'excel';
            else if (text.includes('powerpoint') || text.includes('slide') || text.includes('presentation') || text.includes('slideshow')) type = 'powerpoint';
            else if (text.includes('html') || text.includes('css') || text.includes('tag') || text.includes('web') || text.includes('href') || text.includes('url')) type = 'web';
            else if (text.includes('network') || text.includes('ip') || text.includes('wan') || text.includes('lan') || text.includes('router') || text.includes('protocol') || text.includes('wifi')) type = 'network';
            else if (text.includes('phishing') || text.includes('virus') || text.includes('trojan') || text.includes('firewall') || text.includes('cyber') || text.includes('email')) type = 'security';
            else if (text.includes('photoshop') || text.includes('clone stamp') || text.includes('paint bucket')) type = 'photoshop';
            else if (text.includes('programming') || text.includes('code') || text.includes('variable') || text.includes('syntax') || text.includes('for loop') || text.includes('c++') || text.includes('qbasic') || text.includes('print')) type = 'code';
            else if (text.includes('database') || text.includes('primary key') || text.includes('dbms') || text.includes('access')) type = 'database';
            else if (text.includes('e-commerce') || text.includes('api') || text.includes('http')) type = 'ecommerce';
            else type = 'computer';

            // Golden Gradients
            const gold1 = 'url(#gGold1)';
            const gold2 = 'url(#gGold2)';
            const gold3 = 'url(#gGold3)';
            const strokeGold = '#b8860b';

            const svgs = {
                computer: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <rect x="10" y="38" width="8" height="6" rx="2" fill="${gold2}" stroke="${strokeGold}" stroke-width="1"/>
                    <rect x="22" y="38" width="8" height="6" rx="2" fill="${gold2}" stroke="${strokeGold}" stroke-width="1"/>
                    <rect x="34" y="38" width="8" height="6" rx="2" fill="${gold2}" stroke="${strokeGold}" stroke-width="1"/>
                    <rect x="46" y="38" width="8" height="6" rx="2" fill="${gold2}" stroke="${strokeGold}" stroke-width="1"/>
                    <rect x="16" y="46" width="32" height="6" rx="2" fill="${gold3}" stroke="${strokeGold}" stroke-width="1"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>

                        <linearGradient id="gGold3" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b6508"/></linearGradient>
                    </defs>
                </svg>`,

                mouse: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 14C22 8 26 4 32 4C38 4 42 8 42 14V36C42 44 36 50 32 50C28 50 22 44 22 36V14Z" fill="${gold1}" stroke="${strokeGold}" stroke-width="2"/>
                    <circle cx="32" cy="20" r="4" fill="${gold2}" stroke="${strokeGold}" stroke-width="1.5"/>
                    <rect x="30" y="34" width="4" height="10" rx="2" fill="${strokeGold}"/>
                    <path d="M20 52 L44 52 L40 58 L24 58 L20 52Z" fill="${gold3}" stroke="${strokeGold}" stroke-width="1.5"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
                        <linearGradient id="gGold2" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fff8dc"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
                        <linearGradient id="gGold3" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b6508"/></linearGradient>
                    </defs>
                </svg>`,

                paint: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="20" fill="${gold2}" stroke="${strokeGold}" stroke-width="2"/>
                    <circle cx="24" cy="24" r="6" fill="#ef4444" stroke="${strokeGold}" stroke-width="1.5"/>
                    <circle cx="40" cy="24" r="5" fill="#3b82f6" stroke="${strokeGold}" stroke-width="1.5"/>
                    <circle cx="24" cy="40" r="5" fill="#facc15" stroke="${strokeGold}" stroke-width="1.5"/>
                    <circle cx="40" cy="40" r="6" fill="#22c55e" stroke="${strokeGold}" stroke-width="1.5"/>
                    <path d="M42 28 L56 12 L60 16 L46 32 L42 28Z" fill="${gold1}" stroke="${strokeGold}" stroke-width="1.5"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
                        <linearGradient id="gGold2" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fff8dc"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
                    </defs>
                </svg>`,

                code: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="8" width="56" height="48" rx="8" fill="${gold3}" stroke="${strokeGold}" stroke-width="2"/>
                    <rect x="12" y="16" width="40" height="8" rx="2" fill="#2a1f0a" opacity="0.5"/>
                    <rect x="12" y="28" width="40" height="8" rx="2" fill="#2a1f0a" opacity="0.5"/>
                    <rect x="12" y="40" width="40" height="8" rx="2" fill="#2a1f0a" opacity="0.5"/>
                    <path d="M20 20 L16 24 L20 28" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M44 20 L48 24 L44 28" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M28 38 L32 42 L36 38" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="gGold3" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b6508"/></linearGradient>
                    </defs>
                </svg>`,

                storage: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="32" cy="14" rx="20" ry="8" fill="${gold3}" stroke="${strokeGold}" stroke-width="2"/>
                    <rect x="12" y="14" width="40" height="32" fill="${gold1}" stroke="${strokeGold}" stroke-width="2"/>
                    <ellipse cx="32" cy="46" rx="20" ry="8" fill="${gold3}" stroke="${strokeGold}" stroke-width="2"/>
                    <rect x="22" y="22" width="20" height="16" rx="2" fill="${gold2}" opacity="0.4"/>
                    <path d="M28 30 L32 26 L36 30" stroke="#b8860b" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
                        <linearGradient id="gGold2" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fff8dc"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
                        <linearGradient id="gGold3" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#d4af37"/><stop offset="100%" stop-color="#8b6508"/></linearGradient>
                    </defs>
                </svg>`,

                network: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="24" fill="${gold1}" stroke="${strokeGold}" stroke-width="2"/>
                    <ellipse cx="32" cy="32" rx="16" ry="8" stroke="${strokeGold}" stroke-width="1.5" fill="none"/>
                    <ellipse cx="32" cy="32" rx="8" ry="16" stroke="${strokeGold}" stroke-width="1.5" fill="none"/>
                    <circle cx="32" cy="20" r="3" fill="${strokeGold}"/>
                    <circle cx="32" cy="44" r="3" fill="${strokeGold}"/>
                    <circle cx="20" cy="32" r="3" fill="${strokeGold}"/>
                    <circle cx="44" cy="32" r="3" fill="${strokeGold}"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
                    </defs>
                </svg>`,

                security: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 6 L52 14 V30 C52 42 44 54 32 58 C20 54 12 42 12 30 V14 L32 6Z" fill="${gold1}" stroke="${strokeGold}" stroke-width="2"/>
                    <rect x="24" y="28" width="16" height="12" rx="2" fill="${gold2}" stroke="${strokeGold}" stroke-width="1.5"/>
                    <circle cx="32" cy="34" r="3" fill="${strokeGold}"/>
                    <path d="M32 28 V24" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="gGold1" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fdf0b0"/><stop offset="100%" stop-color="#b8860b"/></linearGradient>
                        <linearGradient id="gGold2" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#fff8dc"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
                    </defs>
                </svg>`,
            };

            return svgs[type] || svgs.computer;
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function getQuestions(levelId) {
            const lv = LEVELS.find(l => l.id === levelId);
            return lv ? lv.questions : [];
        }

        function getFeedback(qkey, q) {
            if (!submitted) return '';
            const selected = selections[qkey] || '';
            if (!selected) return '⬜ Not answered';
            const correct = selected === q.ans;
            const ansText = q.opts[q.ans.charCodeAt(0) - 65];
            if (correct) {
                return `✅ Correct!`;
            } else {
                return `❌ Wrong. Correct answer: <span class="correct-answer">${q.ans}. ${ansText}</span>`;
            }
        }

        function getFeedbackClass(qkey, q) {
            if (!submitted) return '';
            const selected = selections[qkey] || '';
            if (!selected) return '';
            return selected === q.ans ? 'correct' : 'wrong';
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            LEVELS.forEach(lv => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (lv.id === currentLevel ? ' active' : '');
                btn.dataset.level = lv.id;
                btn.innerHTML = `${lv.label} <span class="count">(${lv.questions.length})</span>`;
                btn.addEventListener('click', () => {
                    currentLevel = lv.id;
                    submitted = false;
                    document.getElementById('submittedBadge').classList.remove('show');
                    document.getElementById('summaryBox').classList.remove('show');
                    renderTabs();
                    renderQuiz();
                    updateScore();
                });
                container.appendChild(btn);
            });
        }

        function renderQuiz() {
            const container = document.getElementById('quizContent');
            const questions = getQuestions(currentLevel);
            if (!questions.length) {
                container.innerHTML = '<div class="empty-state">No questions for this level.</div>';
                return;
            }

            let html = `
                <div class="summary-box" id="summaryBox"></div>
            `;

            questions.forEach((q, idx) => {
                const key = `${currentLevel}-${q.id}`;
                const selected = selections[key] || '';
                const svgIcon = get3DSvgForQuestion(q);
                const fbText = getFeedback(key, q);
                const fbClass = getFeedbackClass(key, q);
                const showClass = (submitted && fbText) ? 'show' : '';

                let codeHtml = '';
                if (q.code) {
                    codeHtml = `<div class="code-block"><code>${q.code}</code></div>`;
                }

                html += `
                    <div class="question-card" data-qkey="${key}">
                        <div class="icon-3d-wrapper">
                            ${svgIcon}
                        </div>
                        <div class="q-content">
                            <div class="q-top-row">
                                <span class="q-num">Q${idx+1}</span>
                                <span class="q-text">${q.q}</span>
                            </div>
                            ${codeHtml}
                            <div class="options">
                                ${q.opts.map((opt, oi) => {
                                    const letter = String.fromCharCode(65 + oi);
                                    const checked = selected === letter ? 'checked' : '';
                                    return `
                                        <label>
                                            <input type="radio" name="${key}" value="${letter}" ${checked} />
                                            <span>${letter}. ${opt}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                            <div class="q-feedback ${fbClass} ${showClass}" id="fb-${key}">${fbText}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            container.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const name = this.name;
                    const val = this.value;
                    selections[name] = val;

                    if (submitted) {
                        submitted = false;
                        document.getElementById('submittedBadge').classList.remove('show');
                        document.getElementById('summaryBox').classList.remove('show');
                        document.querySelectorAll('.q-feedback').forEach(el => {
                            el.classList.remove('show', 'correct', 'wrong');
                            el.innerHTML = '';
                        });
                    } else {
                        const fbEl = document.getElementById(`fb-${name}`);
                        if (fbEl) {
                            fbEl.classList.remove('show', 'correct', 'wrong');
                            fbEl.innerHTML = '';
                        }
                    }
                    updateScore();
                });
            });

            document.getElementById('totalBadge').textContent = `${questions.length} questions`;
            document.getElementById('totalDisplay').textContent = questions.length;
            updateScore();
        }

        // ============================================================
        //  SCORE
        // ============================================================
        function updateScore() {
            const questions = getQuestions(currentLevel);
            let correct = 0;
            let answered = 0;
            questions.forEach(q => {
                const key = `${currentLevel}-${q.id}`;
                const sel = selections[key] || '';
                if (sel) {
                    answered++;
                    if (sel === q.ans) correct++;
                }
            });

            const label = document.getElementById('scoreLabel');
            const display = document.getElementById('scoreDisplay');
            const total = document.getElementById('totalDisplay');

            if (submitted) {
                label.textContent = 'Score';
                display.className = 'num';
                display.textContent = correct;
            } else {
                label.textContent = 'Answered';
                display.className = 'num-answered';
                display.textContent = answered;
            }
            total.textContent = questions.length;
        }

        // ============================================================
        //  SUBMIT
        // ============================================================
        function checkAll() {
            const questions = getQuestions(currentLevel);
            if (!questions.length) return;

            submitted = true;
            document.getElementById('submittedBadge').classList.add('show');

            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            questions.forEach(q => {
                const key = `${currentLevel}-${q.id}`;
                const sel = selections[key] || '';
                if (sel) {
                    if (sel === q.ans) correct++;
                    else wrong++;
                } else {
                    unanswered++;
                }
                const fbEl = document.getElementById(`fb-${key}`);
                if (fbEl) {
                    fbEl.innerHTML = getFeedback(key, q);
                    const cls = getFeedbackClass(key, q);
                    fbEl.className = `q-feedback ${cls} show`;
                }
            });

            const summaryBox = document.getElementById('summaryBox');
            summaryBox.innerHTML = `
                📊 <strong>Submission Result</strong> &nbsp;|&nbsp;
                ✅ Correct: <span class="correct-count">${correct}</span> &nbsp;|&nbsp;
                ❌ Wrong: <span class="wrong-count">${wrong}</span> &nbsp;|&nbsp;
                ⬜ Unanswered: <span class="unanswered-count">${unanswered}</span> &nbsp;|&nbsp;
                <strong>Total: ${questions.length}</strong>
            `;
            summaryBox.classList.add('show');
            summaryBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            updateScore();
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetCurrent() {
            const questions = getQuestions(currentLevel);
            questions.forEach(q => {
                const key = `${currentLevel}-${q.id}`;
                delete selections[key];
            });
            submitted = false;
            document.getElementById('submittedBadge').classList.remove('show');
            document.getElementById('summaryBox').classList.remove('show');
            renderQuiz();
            updateScore();
        }

        function clearAllSelections() {
            selections = {};
            submitted = false;
            document.getElementById('submittedBadge').classList.remove('show');
            document.getElementById('summaryBox').classList.remove('show');
            renderQuiz();
            updateScore();
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderQuiz();
            updateScore();

            document.getElementById('checkBtn').addEventListener('click', checkAll);
            document.getElementById('resetBtn').addEventListener('click', resetCurrent);
            document.getElementById('clearAllBtn').addEventListener('click', clearAllSelections);
        });
    </script>
